services:
  redis:
    image: redis:7-alpine
    command: ["sh", "/redis-entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_USER_TIME_PASSWORD: ${REDIS_USER_TIME_PASSWORD:-changeme}
      REDIS_USER_TIME_ID: time
      REDIS_USER_HOME_AUTOMATION_PASSWORD: ${REDIS_USER_HOME_AUTOMATION_PASSWORD:-changeme}
      REDIS_USER_HOME_AUTOMATION_ID: home-automation
    volumes:
      - ./redis/entrypoint.sh:/redis-entrypoint.sh:ro
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -u "redis://proxy:$$REDIS_PASSWORD@localhost:6379/0" --no-auth-warning ping | grep -q PONG;
          else
            redis-cli ping | grep -q PONG;
          fi
      interval: 5s
      timeout: 3s
      retries: 10

  proxy:
    build: .
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  home-automation:
    build: .
    command: ["python", "examples/home_automation.py"]
    environment:
      REDIS_URL: redis://home_automation:${REDIS_USER_HOME_AUTOMATION_PASSWORD:-changeme}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["demo"]

  time-service:
    build: .
    command: ["python", "examples/time_service.py"]
    environment:
      REDIS_URL: redis://time:${REDIS_USER_TIME_PASSWORD:-changeme}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["demo"]

volumes:
  redis-data: